services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragent-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ragent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ragent-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: ragent-rmq-namesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx512m"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9876/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: ragent-rmq-broker
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx1g"
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy

  rustfs:
    image: rustfs/rustfs:latest
    container_name: ragent-rustfs
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin}
    volumes:
      - rustfsdata:/data

volumes:
  pgdata:
  redisdata:
  rustfsdata:
