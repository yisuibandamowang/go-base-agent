# config.example.yaml — ragent-go
# 复制为 configs/config.yaml 后填入你的实际配置。
# configs/config.yaml 不提交到 git。

server:
  port: 9091

database:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  name: ${POSTGRES_DB}
  sslmode: disable

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}
  producer:
    group: ragent-producer_pg
    send-message-timeout: 2000

milvus:
  uri: ${MILVUS_URI}

rag:
  engine:
    type: workflow

  vector:
    type: pg

  graph:
    type: none
    lightrag:
      base-url: http://127.0.0.1:9621
      query-mode: hybrid
    # type=lightrag 时会启用图谱检索通道，并在向量写入/删除后 best-effort 同步 LightRAG 图谱
    embedding-model: qwen-emb-8b

  upload:
    max-file-size-bytes: 52428800
    max-request-size-bytes: 104857600

  default:
    collection-name: rag_default_store
    dimension: 1536
    metric-type: COSINE

  code:
    repo-path: ${RAG_CODE_REPO_PATH:}

  context:
    enrich:
      enabled: true

  citation:
    enabled: false

  query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 500

  rerank:
    enabled: true

  rate-limit:
    global:
      enabled: true
      max-concurrent: 1
      max-wait-seconds: 3
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 8
    summary-start-turns: 9
    summary-enabled: true
    ttl-minutes: 60
    summary-max-chars: 400
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60
      running-timeout-minutes: 30
    feishu:
      app-id: ${FEISHU_APP_ID}
      app-secret: ${FEISHU_APP_SECRET}
      access-token: ${FEISHU_ACCESS_TOKEN}
      tenant-token: ${FEISHU_TENANT_TOKEN}
      base-url: ${FEISHU_BASE_URL:https://open.feishu.cn}
    confluence:
      base-url: ${CONFLUENCE_BASE_URL}
      username: ${CONFLUENCE_USERNAME}
      api-key: ${CONFLUENCE_API_KEY}
      access-token: ${CONFLUENCE_ACCESS_TOKEN}
    geelib:
      enabled: ${GEELIB_ENABLED:true}
      api-base-url: ${GEELIB_API_BASE_URL:}
      app-token: ${GEELIB_APP_TOKEN:}
      user-mail: ${GEELIB_USER_MAIL:}
      user-token: ${GEELIB_USER_TOKEN:}
      session-cookie: ${GEELIB_SESSION_COOKIE:}
      work-dir: ${GEELIB_CLI_WORK_DIR:}
      command: ${GEELIB_CLI_COMMAND:editor-cli}
      tool: ${GEELIB_CLI_TOOL:}
      timeout-seconds: ${GEELIB_CLI_TIMEOUT_SECONDS:30}
      import-task-timeout-minutes: ${GEELIB_IMPORT_TASK_TIMEOUT_MINUTES:30}
      max-bytes: ${GEELIB_CLI_MAX_BYTES:52428800}
      domains:
        - geelib.qihoo.net

  mcp:
    servers:
      - name: default
        url: ${MCP_SERVER_URL}
        domains:
          - sales
          - ticket

  search:
    supplement-ratio: 0.25
    timeout-ms: 15000
    channels:
      vector-global:
        enabled: true
        confidence-threshold: 0.6
        single-intent-supplement-threshold: 0.8
        candidate-budget: 100
        top-k-multiplier: 3
      intent-directed:
        enabled: true
        min-intent-score: 0.4
        top-k-multiplier: 2
      keyword:
        enabled: true
        mode: both
        top-k-multiplier: 1
      graph:
        enabled: false
      web-search:
        enabled: false
        api-url: ${YOUCOM_API_URL:https://api.ydc-index.io/search}
        api-key: ${YDC_API_KEY}
        count: 5
        timeout-seconds: 5
    fusion:
      strategy: rrf
      rrf-k: 60
      rerank-candidate-limit: 50
      channel-weights:
        vector: 1.0
        keyword: 1.0
        graph: 0.8
        web-search: 0.5

  guidance:
    # 是否启用引导式问答（对齐 Java GuidanceProperties 默认 true）
    enabled: true
    # 以下两项对齐 Java：歧义判定已改为候选路径重名触发，这两个值当前不参与判定，保留以兼容既有 yaml
    ambiguity-score-ratio: 0.8
    ambiguity-margin: 0.15
    # 单次最多展示的选项数量
    max-options: 6

  answer-cache:
    enabled: true
    ttl-minutes: 60

  trace:
    enabled: true
    max-error-length: 1000

  parser:
    tika-url: ${TIKA_URL:}

  image-parse:
    description-prompt: |-
      请用中文详细描述这张图片的内容；若图中包含文字，请逐字识别并完整列出（OCR）。先给出整体内容描述，再用“图中文字：”另起一段列出识别到的所有文字。
    max-output-tokens: 4096

ai:
  providers:
    openai:
      url: https://api.openai.com
      api-key: ${OPENAI_API_KEY}
      protocol: openai-compatible
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    anthropic:
      url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY}
      protocol: anthropic
      endpoints:
        chat: /v1/messages
    ollama:
      url: ${OLLAMA_URL:http://localhost:11434}
      protocol: openai-compatible
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY}
      protocol: openai-compatible
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        embedding: /compatible-mode/v1/embeddings
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY}
      protocol: openai-compatible
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    aihubmix:
      url: https://aihubmix.com
      api-key: ${AIHUBMIX_API_KEY:}
      protocol: openai-compatible
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    noop:
      protocol: noop

  selection:
    failure-threshold: 2
    open-duration-ms: 30000
    first-packet-timeout-seconds: 60

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen3-max
    deep-thinking-model: qwen3-max
    default-tier: standard
    deep-thinking-tier: deep
    tiers:
      fast:
        candidates:
          - qwen3-local
          - qwen-plus
        timeout-ms: 5000
      standard:
        candidates:
          - qwen3-max
          - qwen-plus
          - qwen3-local
        timeout-ms: 30000
      deep:
        candidates:
          - qwen3-max
          - glm-4.7
        timeout-ms: 120000
    candidates:
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
        priority: 1
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        supports-thinking: true
        priority: 3
      - id: glm-4.7
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
        priority: 0
      - id: qwen3-local
        provider: ollama
        model: qwen3.6:latest
        priority: 2

  embedding:
    default-model: qwen-emb-8b
    candidates:
      - id: qwen-emb-8b
        provider: bailian
        model: text-embedding-v4
        dimension: 1536
        priority: 1
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: 1536
        priority: 2
      - id: text-embedding-3-large
        provider: aihubmix
        model: text-embedding-3-large
        dimension: 1536
        priority: 3

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

mineru:
  api-url: ${MINERU_API_URL:https://mineru.net/api/v4}
  api-key: ${MINERU_API_KEY:}
  poll-interval-seconds: 5
  timeout-seconds: 300
  enable-table: true
  enable-formula: true
  ocr: false
  language: ch
  concurrency-limit: 16
  semaphore-name: rag:mineru:parse
  max-wait-seconds: 30
  lease-seconds: 900

rustfs:
  url: ${RUSTFS_URL}
  access-key-id: ${RUSTFS_ACCESS_KEY_ID}
  secret-access-key: ${RUSTFS_SECRET_ACCESS_KEY}
  region: ${RUSTFS_REGION:us-east-1}
  kb-bucket: ${RUSTFS_KB_BUCKET:ragent-kb}
  asset-bucket: ${RUSTFS_ASSET_BUCKET:ragent-assets}

auth:
  token-name: Authorization
  timeout-seconds: 2592000

app:
  demo-mode: false
  intent-tree:
    init-from-factory: false
  eval:
    enabled: false
